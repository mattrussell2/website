<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Matthew Russell, PhD</title>
		<meta name="description" content="Matthew Russell, PhD — computer scientist working on Bayesian optimization for fusion beamlines and brain-computer interfaces.">
		<meta name="theme-color" content="#05080d">
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305080d'/%3E%3Cpath d='M4 22c4-6 8-6 12 0s8 6 12 0' fill='none' stroke='%2300c2ba' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='2.5' fill='%23c9a0e8'/%3E%3C/svg%3E">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<style>
			:root {
				--bg: #04070f;
				--panel: rgba(7, 12, 20, 0.78);
				--panel-border: rgba(255, 255, 255, 0.10);
				--text: #e8edf3;
				--muted: #9aa6b5;
				--accent: #00c2ba;
				--accent-2: #c9a0e8;
				--font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
			}
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
			body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
			canvas { display: block; }
			a { color: var(--accent); text-decoration: none; }
			a:hover { text-decoration: underline; text-underline-offset: 3px; }

			/* ---------- persistent top chrome ---------- */
			#chrome {
				position: fixed; top: 0; left: 0; right: 0; z-index: 20;
				display: flex; align-items: center; justify-content: space-between;
				padding: 18px 28px;
				pointer-events: none;
			}
			#chrome > * { pointer-events: auto; }
			#chrome .brand {
				font: 500 13px/1 var(--font); letter-spacing: 0.04em; color: var(--muted);
				padding: 8px 12px; border-radius: 999px; transition: color .2s, background .2s;
			}
			#chrome .brand:hover { text-decoration: none; color: var(--text); background: rgba(255,255,255,0.06); }
			#chrome nav { display: flex; gap: 4px; padding: 4px; border-radius: 999px; transition: background .4s; }
			body.away #chrome nav { background: rgba(5, 8, 13, 0.38); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
			body.away #chrome nav button { color: #cfd8e3; }
			#chrome nav button {
				font: 500 13px/1 var(--font); letter-spacing: 0.04em; text-transform: lowercase;
				color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 999px;
				padding: 8px 12px; cursor: pointer; transition: color .2s, background .2s, border-color .2s;
			}
			#chrome nav button:hover { color: var(--text); background: rgba(255,255,255,0.06); }
			#chrome nav button[aria-current="true"] { color: var(--accent); border-color: rgba(0,194,186,0.35); }
			#chrome nav button.home { color: var(--accent-2); }

			/* ---------- content panel ---------- */
			#panel {
				position: fixed; z-index: 10;
				width: min(680px, calc(100vw - 48px));
				max-height: 80vh; overflow-y: auto; overscroll-behavior: contain;
				padding: 36px 40px 32px;
				background: var(--panel);
				border: 1px solid var(--panel-border);
				border-radius: 16px;
				box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
				-webkit-backdrop-filter: blur(18px) saturate(140%);
				backdrop-filter: blur(18px) saturate(140%);
				opacity: 0; visibility: hidden; transform: translateY(12px);
				transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
				scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent;
			}
			#panel.open { opacity: 1; visibility: visible; transform: translateY(0); transition-delay: 0s; }
			/* centered over a full-screen scene (about / research) */
			#panel.center { left: 50%; top: 50%; transform: translate(-50%, calc(-50% + 12px)); }
			#panel.center.open { transform: translate(-50%, -50%); }
			/* on wide screens, sit the card right of the name so name · card · cube read as three columns */
			@media (min-width: 1100px) { #panel.center { left: calc(50% + 90px); } }

			#panel h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; }
			#panel h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 26px 0 10px; }
			#panel h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
			#panel p { font-size: 15.5px; line-height: 1.6; margin: 0 0 12px; color: var(--text); }
			#panel .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 8px; }
			#panel .role { font-size: 14px; color: var(--muted); margin: -4px 0 10px; }
			#panel .lede { font-size: 17px; color: var(--muted); margin-bottom: 18px; }
			#panel .hint { color: var(--muted); font-size: 14px; }
			#panel .linkrow { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; font-weight: 500; }
			#panel ul.bullets { margin: 0; padding-left: 18px; }
			#panel ul.bullets li { font-size: 15px; line-height: 1.55; margin-bottom: 6px; }
			#panel b { font-weight: 600; color: #fff; }

			#panel ol.pubs { list-style: none; margin: 0; padding: 0; counter-reset: pub; }
			#panel ol.pubs li { position: relative; padding-left: 30px; margin-bottom: 14px; font-size: 14px; line-height: 1.5; }
			#panel ol.pubs li::before { counter-increment: pub; content: counter(pub); position: absolute; left: 0; top: 2px; font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--panel-border); border-radius: 6px; width: 20px; height: 20px; display: grid; place-items: center; }
			#panel .pub-authors { display: block; color: var(--muted); }
			#panel .pub-title { display: block; color: var(--text); font-weight: 500; }
			#panel .pub-venue { display: block; color: var(--muted); font-style: italic; }
			#panel .pub-links { display: flex; gap: 14px; margin-top: 3px; font-size: 13px; font-weight: 500; }

			#panel details.more { margin-top: 22px; border-top: 1px solid var(--panel-border); padding-top: 12px; }
			#panel details.more summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); list-style: none; }
			#panel details.more summary::before { content: '+'; display: inline-block; width: 16px; color: var(--accent); }
			#panel details.more[open] summary::before { content: '−'; }
			#panel details.more summary:hover { color: var(--text); }

			#panel ul.courses { list-style: none; margin: 0; padding: 0; }
			#panel ul.courses li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--panel-border); font-size: 14.5px; }
			#panel ul.courses li:last-child { border-bottom: 0; }
			#panel ul.courses .meta { color: var(--muted); white-space: nowrap; font-size: 13px; }

			#panel ul.projects { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
			#panel ul.projects li { display: flex; }
			#panel ul.projects a { display: block; flex: 1; padding: 10px 12px; border: 1px solid var(--panel-border); border-radius: 10px; transition: border-color .2s, background .2s; }
			#panel ul.projects a:hover { text-decoration: none; border-color: rgba(0,194,186,0.45); background: rgba(0,194,186,0.06); }
			#panel ul.projects .name { display: block; font-size: 14px; font-weight: 600; color: var(--text); }
			#panel ul.projects .blurb { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
			#panel ul.projects + .linkrow { margin-top: 14px; }

			#panel ul.tools { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
			#panel ul.tools li { display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 7px; border: 1px solid var(--panel-border); border-radius: 999px; font-size: 12.5px; color: var(--muted); }
			#panel ul.tools img { width: 16px; height: 16px; }
			#panel ul.tools img.dark { filter: invert(1) brightness(1.1); }   /* single-color dark logos */

			/* ---------- small screens ---------- */
			@media (max-width: 720px) {
				#chrome { padding: 10px 8px; justify-content: center; }
				#chrome .brand { position: absolute; left: 14px; top: 12px; font-size: 13px; }
				#chrome { padding-top: 40px; }
				#chrome nav { flex-wrap: wrap; justify-content: center; gap: 0; width: 100%; }
				#chrome nav button { font-size: 12px; padding: 7px 6px; letter-spacing: 0.02em; }

				/* every panel becomes a bottom sheet */
				#panel, #panel.center {
					left: 0; right: 0; top: auto; bottom: 0;
					width: 100%; max-height: 72vh;
					padding: 22px 20px 28px;
					border-radius: 18px 18px 0 0; border-bottom: 0;
					transform: translateY(16px);
				}
				#panel.open, #panel.center.open { transform: translateY(0); }
				#panel h1 { font-size: 24px; }
				#panel p { font-size: 15px; }
				#panel ul.projects { grid-template-columns: 1fr; }
				#panel ul.courses li { flex-direction: column; gap: 2px; }
			}
			@media (max-width: 380px) {
				#chrome nav button { font-size: 11px; padding: 6px 5px; }
			}

			@media (prefers-reduced-motion: reduce) { #panel, #chrome * { transition: none !important; } }
			body.noanim #panel, body.noanim #chrome * { transition: none !important; }

			.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
		</style>
	</head>
	<body>
		<header id="chrome">
			<a class="brand" href="#" data-section="home">home</a>
			<nav aria-label="Sections">
				<button data-section="about">about</button>
				<button data-section="research">research</button>
				<button data-section="software">software</button>
				<button data-section="teaching">teaching</button>
				<button data-section="resume">resume</button>
				<button data-section="contact">contact</button>
			</nav>
		</header>

		<aside id="panel" aria-live="polite"></aside>

		<script src="./bundle.js"></script>

		<div class="sr-only" aria-label="website">
			<section id="about"><h1>About</h1><p>Matthew Russell, PhD. Software engineer in scientific computing at Acceleron Fusion; formerly a PhD candidate in brain-computer interfaces at the Tufts Human-Computer Interaction Lab.</p></section>
			<section id="contact"><h1>Contact</h1><p>mrussell at cs dot tufts dot edu</p><a href="./assets/resume.pdf">Resume</a></section>
		</div>
	</body>
</html>
